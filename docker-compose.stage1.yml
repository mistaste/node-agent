name: guardex-node

# Stage 1 transport override. This file is intentionally inert unless the
# operator runs:
#
#   docker compose -f docker-compose.yml -f docker-compose.stage1.yml up -d --build
#
# Keep the base compose file compatible with existing nodes until Stage 1 is
# explicitly authorized and canaried.

services:
  node-agent:
    cap_add: !reset []
    environment:
      TRUSTTUNNEL_PROCESS_MODE: "external"
      TRANSPORT_BUNDLE_ENABLED: "${TRANSPORT_BUNDLE_ENABLED:-false}"
      TRANSPORT_BUNDLE_ROOT: "/data/transport-bundle"

  trusttunnel-runner:
    build: .
    restart: unless-stopped
    network_mode: host
    # Avoid the host loopback resolver: endpoint DNS sockets carry UID 65532
    # and must follow the same fail-closed policy route through the exit node.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    command: trusttunnel-runner
    environment:
      TRUSTTUNNEL_BINARY: "/opt/trusttunnel/trusttunnel_endpoint"
      TRUSTTUNNEL_ROOT: "/data/trusttunnel"
      TRUSTTUNNEL_RUNNER_INTERVAL: "250ms"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      # The runner starts the endpoint as UID 65532. CAP_KILL is required so
      # it can stop that lower-privilege child before applying a new revision.
      - KILL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.35
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    volumes:
      - ./data/trusttunnel:/data/trusttunnel
  transport-bundle-runner:
    build: .
    restart: unless-stopped
    network_mode: host
    command: transport-bundle-runner
    environment:
      TRANSPORT_BUNDLE_ROOT: "/data/transport-bundle"
      CADDY_BINARY: "/usr/bin/caddy"
      HAPROXY_BINARY: "/usr/sbin/haproxy"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /config:size=16m,mode=0700
      - /data/caddy:size=16m,mode=0700
      - /run:size=4m,mode=0755
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - NET_ADMIN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    pids_limit: 96
    mem_limit: 256m
    cpus: 0.35
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    volumes:
      - ./data/transport-bundle:/data/transport-bundle
      - ./data/trusttunnel:/data/trusttunnel:ro

  topology-agent:
    build: .
    restart: unless-stopped
    network_mode: host
    command: topology-agent
    extra_hosts:
      - "api.guardex-vpn.com:${CONTROLLER_ORIGIN_IP:-80.241.216.139}"
    env_file: .env
    environment:
      TOPOLOGY_ROOT: "/data/topology"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      # A dedicated EXIT may need UDP 443 when its provider rate-limits high
      # WireGuard ports. NET_ADMIN can configure the interface but does not
      # authorize binding a privileged listen port.
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.35
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    volumes:
      - ./data/topology:/data/topology
