name: guardex-node

services:
  xray:
    # Keep the server on the exact Xray build validated against Guardex clients.
    # The clients use a separate embedded core, so every server upgrade must go
    # through compatibility tests and a canary instead of following `latest`.
    image: ghcr.io/xtls/xray-core:26.6.1@sha256:3943bddece5fab72308a4415917f0391917b7b81ddbf50708988b89e6e2bd213
    restart: unless-stopped
    network_mode: host
    # Run as root: the image drops to a non-privileged user that cannot bind the
    # VLESS port 443 (<1024). Root keeps the default NET_BIND_SERVICE capability.
    user: "0:0"
    command: run -config /etc/xray/config.json
    volumes:
      - ./xray-config.json:/etc/xray/config.json:ro
      # Node-agent creates durable per-profile TLS keypairs; Xray only reads them.
      - ./data/tls:/etc/guardex/tls:ro

  node-agent:
    build: .
    restart: unless-stopped
    network_mode: host
    # Controller machine traffic must not traverse Cloudflare's browser/WAF
    # challenge. Keep the public hostname for SNI and certificate validation,
    # but resolve it directly to the Guardex API origin inside this container.
    extra_hosts:
      - "api.guardex-vpn.com:${CONTROLLER_ORIGIN_IP:-80.241.216.139}"
    env_file: .env
    environment:
      XRAY_CORE_VERSION: "26.6.1"
      HYSTERIA_TLS_DIR: "/etc/guardex/tls"
      TRUSTTUNNEL_ENABLED: "${TRUSTTUNNEL_ENABLED:-true}"
      TRUSTTUNNEL_VERSION: "1.0.33"
      TRUSTTUNNEL_BINARY: "/opt/trusttunnel/trusttunnel_endpoint"
      TRUSTTUNNEL_ROOT: "/data/trusttunnel"
      TRUSTTUNNEL_PROCESS_MODE: "external"
      TRANSPORT_BUNDLE_ENABLED: "${TRANSPORT_BUNDLE_ENABLED:-true}"
      TRANSPORT_BUNDLE_ROOT: "/data/transport-bundle"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    # TrustTunnel is intentionally the only agent-managed endpoint allowed on
    # the standard HTTPS port. Keep every other Linux capability dropped.
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      # Durable user and dynamic-inbound stores — survive container/Xray restarts.
      - ./data:/data
      # Writable only in the agent; private keys are never sent to the controller.
      - ./data/tls:/etc/guardex/tls
      # Enables controlled git-based self-update from the admin panel.
      - ./:/opt/guardex-node:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  trusttunnel-runner:
    build: .
    restart: unless-stopped
    network_mode: host
    dns:
      - 1.1.1.1
      - 1.0.0.1
    command: trusttunnel-runner
    environment:
      TRUSTTUNNEL_BINARY: "/opt/trusttunnel/trusttunnel_endpoint"
      TRUSTTUNNEL_ROOT: "/data/trusttunnel"
      TRUSTTUNNEL_RUNNER_INTERVAL: "250ms"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - KILL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.35
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    volumes:
      - ./data/trusttunnel:/data/trusttunnel

  transport-bundle-runner:
    build: .
    restart: unless-stopped
    network_mode: host
    command: transport-bundle-runner
    environment:
      TRANSPORT_BUNDLE_ROOT: "/data/transport-bundle"
      CADDY_BINARY: "/usr/bin/caddy"
      HAPROXY_BINARY: "/usr/sbin/haproxy"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /config:size=16m,mode=0700
      - /run:size=4m,mode=0755
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - NET_ADMIN
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    pids_limit: 96
    mem_limit: 256m
    cpus: 0.35
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    volumes:
      - ./data/transport-bundle:/data/transport-bundle
      - ./data/trusttunnel:/data/trusttunnel:ro
      - ./data/caddy:/data/caddy

  topology-agent:
    build: .
    restart: unless-stopped
    network_mode: host
    command: topology-agent
    extra_hosts:
      - "api.guardex-vpn.com:${CONTROLLER_ORIGIN_IP:-80.241.216.139}"
    env_file: .env
    environment:
      TOPOLOGY_ROOT: "/data/topology"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.35
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    volumes:
      - ./data/topology:/data/topology
