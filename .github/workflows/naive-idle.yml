name: Naive idle and transport diagnostics

on:
  pull_request:
    paths: ['cmd/naive-idle-check/**', 'cmd/transport-diagnose/**', 'internal/transportdiag/**', 'internal/transportbundle/**', 'ops/**', 'Dockerfile', 'go.mod', 'go.sum', '.github/workflows/naive-idle.yml', '.github/workflows/release.yml']
  push:
    branches: [master]
    paths: ['cmd/naive-idle-check/**', 'cmd/transport-diagnose/**', 'internal/transportdiag/**', 'internal/transportbundle/**', 'ops/**', 'Dockerfile', 'go.mod', 'go.sum', '.github/workflows/naive-idle.yml', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naive-idle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - name: Test policy, evidence tools and Go code
        run: |
          python3 ops/check_caddy_idle_policy.py
          python3 -m unittest discover -s ops -p test_caddy_idle_policy.py
          python3 -m unittest discover -s ops -p 'test_*transport*.py'
          go test -race ./...
          go vet ./cmd/naive-idle-check ./cmd/transport-diagnose ./internal/transportdiag
      - name: Build the pinned production Caddy stage
        run: docker build --target caddy-naive -t guardex-caddy-idle-check .
      - name: Test idle CONNECT with actual compiled Caddy
        timeout-minutes: 8
        run: |
          mkdir -p acceptance
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=readonly -trimpath -o acceptance/naive-idle-check ./cmd/naive-idle-check
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=readonly -trimpath -o acceptance/transport-diagnose-linux-amd64 ./cmd/transport-diagnose
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -mod=readonly -trimpath -o acceptance/transport-diagnose-linux-arm64 ./cmd/transport-diagnose
          sha256sum acceptance/* > acceptance/SHA256SUMS
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --memory 128m --pids-limit 64 --read-only --user 65532:65532 \
            --tmpfs /tmp:rw,nosuid,nodev,size=16m \
            -v "$PWD/acceptance/naive-idle-check:/guardex-idle-check:ro" \
            --entrypoint /guardex-idle-check guardex-caddy-idle-check \
            -caddy /caddy -idle 90s,180s,300s | tee acceptance/results.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: naive-idle-${{ github.sha }}
          path: acceptance/
          if-no-files-found: warn
