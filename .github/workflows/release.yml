name: Signed node-agent release

on:
  push:
    tags: ['agent-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: node-agent-release
  cancel-in-progress: false

jobs:
  verify-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test -race ./...
      - name: Build binaries
        run: |
          mkdir -p release
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o release/node-agent-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o release/node-agent-linux-arm64 .
          sha256sum release/* > release/SHA256SUMS
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: release/sbom.spdx.json
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha,scope=node-agent-release
          cache-to: type=gha,mode=max,scope=node-agent-release
      - uses: sigstore/cosign-installer@v3
      - name: Keyless-sign immutable image
        run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@v4
        with:
          name: node-agent-${{ github.sha }}
          path: release/
          if-no-files-found: error
      - name: Request guarded rollout
        env:
          URL: ${{ secrets.ROLLOUT_WEBHOOK_URL }}
          SECRET: ${{ secrets.ROLLOUT_WEBHOOK_SECRET }}
          TARGET: ${{ github.sha }}
        if: ${{ env.URL != '' && env.SECRET != '' }}
        run: |
          ROLLBACK=$(git rev-parse HEAD^)
          BODY=$(printf '{"target_commit":"%s","rollback_commit":"%s","mode":"git"}' "$TARGET" "$ROLLBACK")
          TS=$(date +%s)
          SIG=$(printf '%s.%s' "$TS" "$BODY" | openssl dgst -sha256 -hmac "$SECRET" -hex | awk '{print $2}')
          curl --fail-with-body --retry 3 --retry-all-errors \
            -H 'Content-Type: application/json' -H "X-Guardex-Timestamp: $TS" -H "X-Guardex-Signature: sha256=$SIG" \
            --data "$BODY" "$URL"
