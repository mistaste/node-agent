name: Signed node-agent release

on:
  push:
    tags: ['agent-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: node-agent-release
  cancel-in-progress: false

jobs:
  verify-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test -race ./...
      - name: Build binaries
        run: |
          mkdir -p release
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o release/node-agent-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o release/node-agent-linux-arm64 .
          sha256sum release/* > release/SHA256SUMS
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: release/sbom.spdx.json
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha,scope=node-agent-release
          cache-to: type=gha,mode=max,scope=node-agent-release
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Keyless-sign immutable image
        run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-agent-${{ github.sha }}
          path: release/
          if-no-files-found: error
      - name: Request guarded rollout
        env:
          URL: ${{ secrets.ROLLOUT_WEBHOOK_URL }}
          ORIGIN_IP: ${{ secrets.ROLLOUT_ORIGIN_IP }}
          SECRET: ${{ secrets.ROLLOUT_WEBHOOK_SECRET }}
          TARGET: ${{ github.sha }}
        if: ${{ env.URL != '' && env.ORIGIN_IP != '' && env.SECRET != '' }}
        run: |
          ROLLBACK=$(git rev-parse HEAD^)
          BODY=$(printf '{"target_commit":"%s","rollback_commit":"%s","mode":"git"}' "$TARGET" "$ROLLBACK")
          TS=$(date +%s)
          SIG=$(printf '%s.%s' "$TS" "$BODY" | openssl dgst -sha256 -hmac "$SECRET" -hex | awk '{print $2}')
          curl --fail-with-body --retry 3 --retry-all-errors \
            --resolve "api.guardex-vpn.com:443:$ORIGIN_IP" \
            -H 'Content-Type: application/json' -H "X-Guardex-Timestamp: $TS" -H "X-Guardex-Signature: sha256=$SIG" \
            --data "$BODY" "$URL"
